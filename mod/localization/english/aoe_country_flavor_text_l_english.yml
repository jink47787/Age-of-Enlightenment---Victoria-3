l_english:
    RUS_FLAVOR_TEXT:0 "Under Peter I, Russia turns its gaze westward, seeking to break Sweden’s dominion over the Baltic. Yet the price of modernization and war may prove as formidable as the enemies beyond its borders. A new empire may emerge from the struggle—or the old order may exact its revenge."
    SWE_FLAVOR_TEXT:0 "Newly crowned Charles XII inherits a Swedish Empire at the height of its power, dominating the Baltic and commanding respect across northern Europe. Yet Denmark-Norway, Poland-Lithuania, and Russia conspire to challenge this supremacy, threatening to end Sweden’s age of greatness before the young king has truly begun to rule. Whether Charles will preserve his inheritance or watch it crumble remains uncertain."
    PLC_FLAVOR_TEXT:0 "The Polish-Lithuanian Commonwealth finds itself torn between royal ambition and the liberties of its powerful nobility. As Sweden and Russia prepare to settle their rivalry upon its lands, the Commonwealth risks becoming a battlefield for foreign kings. Its crown may yet be strengthened—or reduced to a prize for its neighbours."
    SPA_FLAVOR_TEXT:0 "Spain stands at the edge of a dynastic crisis, as the ailing Charles II leaves the fate of a vast empire uncertain. France and Austria watch hungrily, each preparing to stake its claim upon the Spanish inheritance. The coming struggle may decide not only who wears the crown, but whether Spain can remain whole."
    FRA_FLAVOR_TEXT:0 "Under Louis XIV, France stands at the height of its glory, its armies formidable and its court the envy of Europe. Yet the Spanish succession threatens to draw the Sun King into another struggle against rival powers, while the burdens of ambition weigh upon his realm. The splendour of Versailles may endure—or become the prelude to a reckoning."
    AUS_FLAVOR_TEXT:0 "Under Emperor Leopold I, the Habsburg Monarchy emerges victorious from its long struggle against the Ottomans, sealed by the Treaty of Karlowitz. Yet with the Spanish succession looming and France ever watchful, Vienna faces new conflicts that may reshape the balance of Europe. The House of Habsburg may rise to greater heights—or find its many crowns too heavy to bear."
    BRN_FLAVOR_TEXT:0 "Under Frederick III, Brandenburg seeks to elevate itself from a scattered collection of territories into a kingdom worthy of Europe’s great powers. With the Hohenzollerns’ ambitions growing and the continent drifting toward another great war, Brandenburg must choose carefully where to place its loyalty. A crown may soon be within reach—but every elevation carries its own price."
    GBR_FLAVOR_TEXT:0 "Under William III, England stands wary of France, its influence increasingly bound to the fortunes of the Dutch Republic and the fate of the Spanish succession. With the aging king lacking an heir and rival dynasties circling the European thrones, the stability of the crown remains uncertain. Beyond the Channel, the next great struggle is already taking shape."
    NET_FLAVOR_TEXT:0 "The Dutch Republic remains a wealthy maritime power, but its prosperity rests uneasily beneath the shadow of Louis XIV’s France. Bound to England and the Habsburgs by fear of French expansion, the Republic faces another struggle that may test both its armies and its commercial supremacy. The fortunes of the great trading cities may yet be decided on distant battlefields."
    BAV_FLAVOR_TEXT:0 "Bavaria is caught between the ambitions of France and the Habsburgs, its ruler tempted by the promise of greater power. As Europe drifts toward a struggle over the Spanish inheritance, his loyalties may bring his dynasty glory—or draw his lands into ruin. In the shadow of empires, even an ambitious prince may find himself gambling with his crown.
    QNG_FLAVOR_TEXT:0 "Under the Kangxi Emperor, the Qing Empire stands vast and formidable, its authority extending across a realm still shaped by conquest and consolidation. Yet unrest along distant frontiers and the burden of governing an immense empire threaten to test the dynasty’s strength. Whether the Dragon Throne can preserve its hard-won stability remains uncertain."
    TUR_FLAVOR_TEXT:0 "The Ottoman Empire struggles to recover from its defeats against the Habsburgs and the loss of territories sealed by the Treaty of Karlowitz. Though its armies remain formidable, Russia, Austria, and Venice watch for further opportunities to expand at the Sultan’s expense. The empire’s future may depend on whether it can reclaim its strength—or halt the slow retreat of its frontiers."
    TKG_FLAVOR_TEXT:0 "Under the Tokugawa shogunate, Japan enjoys an uneasy peace, its domains held in check by the authority of the shogun and the watchful eyes of the ruling elite. Sealed away from much of the outside world, the nation appears stable, yet beneath its rigid order, rivalries and hidden tensions endure. Whether this isolation will preserve Japan or leave it unprepared for a changing world remains unknown."
    HET_FLAVOR_TEXT:0 "Under Ivan Mazepa, the Cossack Hetmanate struggles to preserve its autonomy between the competing ambitions of Russia, Poland-Lithuania, and the Ottoman world. The Hetman seeks to strengthen his authority, but every alliance risks trading one master for another. As the great powers prepare for war, the fate of the Cossacks hangs in the balance."
    ZZH_FLAVOR_TEXT:0 "The Zaporozhian Cossacks cling fiercely to their freedom, caught between the ambitions of the Russian Tsar, the Polish-Lithuanian Commonwealth, and the Ottoman Sultan. Their allegiance is ever-changing, their independence precarious, and powerful neighbours grow increasingly unwilling to tolerate an unconquered frontier. The Sich may yet defend its ancient liberties—or be swept aside by the empires closing in."
    PER_FLAVOR_TEXT:0 "Safavid Persia stands proud but increasingly burdened by court intrigues, religious tensions, and restless frontiers. While the Ottomans and Mughals watch from beyond its borders, the foundations of the ancient dynasty begin to show cracks. The Peacock Throne may yet endure—or fall to forces gathering unseen at the edges of the realm."
    MUG_FLAVOR_TEXT:0 "Under Aurangzeb, the Mughal Empire stretches across much of India, its immense wealth matched only by the burdens of endless campaigns and growing resistance. Maratha powers challenge imperial authority, while tensions within the empire threaten to outlast the emperor himself. The Peacock Throne still commands awe, but shadows gather over its future."
    POR_FLAVOR_TEXT:0 "Portugal rests upon the wealth of its overseas empire and its close ties to England, yet its fortunes remain vulnerable to the ambitions of Europe’s great powers. As the Spanish succession threatens to ignite a continental war, Lisbon may be forced to choose between old alliances and dangerous new commitments. The kingdom’s independence is secure for now—but its future may be decided far from its shores."
    VEN_FLAVOR_TEXT:0 "The Most Serene Republic of Venice clings to its ancient prestige, its merchant fleets and diplomatic cunning preserving an influence that no longer matches its former glory. With the Ottomans weakened but Austria and other powers rising, Venice faces an uncertain balance between opportunity and decline. The Republic has survived centuries of upheaval, but the coming storm may leave it with little room to manoeuvre."
    SVY_FLAVOR_TEXT:0 "Under Victor Amadeus II, Savoy navigates the dangerous rivalries between France and the Habsburgs, its ambitions far exceeding the strength of its modest domains. As Europe edges toward a struggle over the Spanish inheritance, the duke must turn shifting alliances into an opportunity—or risk seeing his lands become a battlefield for greater powers. In this game of crowns, survival may demand more than loyalty."
    SAX_FLAVOR_TEXT:0 "Saxony stands poised between the ambitions of its elector and the turbulent rivalries of Europe. With eyes fixed on the Polish crown and Sweden’s power looming to the north, Augustus risks drawing his lands into conflicts far beyond their borders. Saxony may rise through ambition and cunning—or pay dearly for its ruler’s dreams of greatness."
    DNN_FLAVOR_TEXT:0 "Denmark-Norway seeks to challenge Sweden’s dominance over the Baltic and reclaim its influence in the north. Yet with Charles XII’s armies poised for war and Russia joining the struggle, Copenhagen risks awakening a power it cannot easily contain. The fate of the Danish crowns may be decided by a conflict that has only just begun."
    MAH_FLAVOR_TEXT:0 "The Maratha state struggles to maintain unity amid Mughal invasion, contested leadership, and the shifting loyalties of powerful warrior clans. With authority dispersed among regional commanders and the royal house fighting for survival, the foundations of a stronger confederacy may be forming amid the chaos. Whether these divisions will forge a resilient new order or tear the Marathas apart remains uncertain."
    GENERIC_FLAVOR_TEXT:0 "The old order stands on the brink of upheaval, as empires rise, dynasties falter, and ambitious rulers prepare to redraw the map of the world. Enlightenment ideas challenge ancient traditions, spreading questions that may one day shake the foundations of thrones and ignite revolutions. A new age is dawning—but whether it will bring progress, chaos, or ruin remains unknown."
    
    