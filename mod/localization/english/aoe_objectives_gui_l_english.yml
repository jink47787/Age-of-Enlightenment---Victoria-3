l_english:

    objective_north_america: "North America"
    objective_north_america_desc: "North America remains a continent of competing empires and Indigenous nations, as Britain, France, and Spain struggle for control of its vast frontiers. Colonial rivalries, expanding settlements, and growing resentment toward distant crowns threaten to ignite wars that will reshape the continent. From the forests of Canada to the plantations of the south, the seeds of rebellion are taking root—and an empire may soon lose its hold on the New World."
    objective_south_america: "South America"
    objective_south_america_desc: "South America remains divided between the colonial empires of Spain and Portugal, whose wealth flows across the ocean while Indigenous peoples and enslaved populations bear the weight of imperial rule. Yet beneath the authority of distant crowns, rivalries, unrest, and new ideas begin to take root, threatening to unsettle the colonial order. In the century to come, revolutions may shatter empires and give birth to new nations, but freedom will come at a terrible price."
    objective_western_europe: "Western Europe"
    objective_western_europe_desc: "Western Europe stands on the brink of a dynastic storm, as the Spanish succession threatens to pit the Bourbons against the Habsburgs and draw England and the Dutch Republic into another great war. Yet beyond the ambitions of kings, Enlightenment ideas begin to challenge the foundations of the old order, planting seeds that may one day bring thrones crashing down. The coming age may be shaped not only by wars between nations, but by revolutions within them."
    objective_eastern_europe: "Eastern Europe"
    objective_eastern_europe_desc: "Eastern Europe stands poised between empires, as Russia rises under Peter the Great, the Ottoman Empire retreats, and Sweden’s supremacy faces a gathering storm. Poland-Lithuania risks becoming a battleground for its neighbours, while the ambitions of monarchs threaten to redraw borders and extinguish old sovereignties. In the century to come, wars, partitions, and revolutionary upheavals may bury ancient kingdoms and forge nations yet unimagined."
    objective_asia: "Asia"
    objective_asia_desc: "Asia’s great empires still command immense wealth and power, from Qing China and Mughal India to Safavid Persia, yet beneath their splendour, cracks begin to show. Rebellions, dynastic decline, and the growing reach of European trading companies threaten to unsettle ancient orders, while new powers rise from within and beyond. In the century to come, thrones may crumble, borders may shift, and distant outsiders may claim a growing share of Asia’s fate."
    
